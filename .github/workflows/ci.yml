name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fluxowork_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fluxowork_test
      JWT_ACCESS_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        if: matrix.app == 'api'
        run: pnpm --filter api exec prisma generate

      - name: Prisma migrate deploy
        if: matrix.app == 'api'
        run: pnpm --filter api exec prisma migrate deploy

      - name: Lint
        run: pnpm --filter ${{ matrix.app }} lint

      - name: Typecheck
        run: pnpm --filter ${{ matrix.app }} typecheck

      - name: Test
        run: pnpm --filter ${{ matrix.app }} test

      - name: Build
        run: pnpm --filter ${{ matrix.app }} build
